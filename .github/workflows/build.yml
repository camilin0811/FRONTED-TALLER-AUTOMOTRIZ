name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # `npm run build` ejecuta `tsc -b` antes de empaquetar: un error de
      # tipos contra los DTO del backend rompe el build, no la pantalla.
      - run: npm run build

  imagen:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taller-frontend:ci

      # Comprueba lo que mas se rompe al desplegar una aplicacion de una sola
      # pagina: que una ruta del enrutador devuelva el index y no un 404.
      - name: Comprobar el servicio y el fallback de rutas
        run: |
          docker run --rm -d --name web -p 8081:80 taller-frontend:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8081/ > /dev/null && break
            sleep 2
          done
          raiz=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/)
          ruta=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/recepcion)
          docker rm -f web
          echo "raiz=$raiz  ruta-interna=$ruta"
          test "$raiz" = "200" && test "$ruta" = "200"
