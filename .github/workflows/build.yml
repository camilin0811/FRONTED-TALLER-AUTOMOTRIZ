name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # `npm run build` ejecuta `tsc -b` antes de empaquetar: un error de
      # tipos contra los DTO del backend rompe el build, no la pantalla.
      - run: npm run build
