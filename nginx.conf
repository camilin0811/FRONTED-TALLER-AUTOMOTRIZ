server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Misma razon que en netlify.toml: las rutas del enrutador no son
    # archivos. Sin este fallback, recargar /recepcion da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los bundles llevan hash en el nombre, asi que se pueden cachear para
    # siempre. El index.html no: debe revalidarse en cada carga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
